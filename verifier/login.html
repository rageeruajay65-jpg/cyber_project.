<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>User Login</title>
</head>
<body>
  <main class="container">
    <div class="cards">
      <img src="assets/images/avatar-jessica.jpeg" class="avatar-image">
      <div class="name"><strong>User Login</strong></div>
      <div class="inputs">
        <input type="text" class="input-box" placeholder="Username" aria-label="Username">
        <input type="password" class="input-box" placeholder="Password" aria-label="Password">
        <select class="input-box select-box" aria-label="Clearance level">
          <option value="" disabled selected>Clearance level</option>
          <option value="1">Level 1</option>
          <option value="2">Level 2</option>
          <option value="3">Level 3</option>
        <input type="submit" class="submit" placeholder="Submit" aria-label="Submit">
        </select>
      </div>
    </div>
  </main>
</body>
</html>
